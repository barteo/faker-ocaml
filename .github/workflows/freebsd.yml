name: FreeBSD

# Builds and tests on a real FreeBSD VM. FreeBSD's libm (msun) rounds some
# results differently from glibc and macOS (see Distributor.exponential in the
# README), and opam-repo-ci tests on FreeBSD too. The VM builds OCaml from
# source, so a run takes about 20 minutes. That's why this is a separate
# workflow and doesn't run on pushes to main.
on:
  pull_request:
  # Weekly, alongside the main CI's run against the newest opam releases.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: vmactions/freebsd-vm@v1
        with:
          # Track the newest 15.x, which is what opam-repo-ci tests.
          release: "15"
          cpu: 4
          mem: 8192
          copyback: false
          prepare: |
            pkg install -y ocaml-opam gmake curl git
          run: |
            set -e
            export OPAMYES=1 OPAMROOTISOK=1
            freebsd-version
            # git rejects the synced checkout in the VM (exit 128), so
            # `opam install . --deps-only` fails in its `git ls-files`. Log
            # git's message, then install the dependencies by name (keep in
            # sync with dune-project) so opam doesn't touch the checkout.
            git config --global --add safe.directory "$PWD"
            git ls-files >/dev/null || true
            opam init --bare --disable-sandboxing --no-setup
            opam switch create ci ocaml-base-compiler
            eval "$(opam env --switch=ci)"
            ocaml -version
            opam install dune alcotest
            dune build
            dune test
