name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest opam releases, so a breaking upstream
  # release shows up even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Cache the fully-installed local switch (_opam) so most runs skip
      # setup-ocaml and the dependency install. The ISO week in the key makes
      # the first run of each week rebuild it against the newest opam releases.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - id: switch-cache
        uses: actions/cache/restore@v6
        with:
          path: _opam
          key: switch-${{ runner.os }}-${{ runner.arch }}-ocaml${{ matrix.ocaml-compiler }}-${{ hashFiles('*.opam') }}-${{ steps.week.outputs.week }}

      - if: steps.switch-cache.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - if: steps.switch-cache.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test

      # setup-ocaml restores its own cache of the bare switch, so bring every
      # package up to the latest release instead of keeping whatever was cached.
      - if: steps.switch-cache.outputs.cache-hit != 'true'
        run: opam update && opam upgrade --yes

      # Saved before build and test so a failing test doesn't force the next
      # run to rebuild the switch.
      - if: steps.switch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: _opam
          key: ${{ steps.switch-cache.outputs.cache-primary-key }}

      # The switch lives at the same absolute path on every run, so its
      # binaries work straight from PATH without opam.
      - run: echo "$GITHUB_WORKSPACE/_opam/bin" >> "$GITHUB_PATH"

      - run: dune build

      - run: dune test
