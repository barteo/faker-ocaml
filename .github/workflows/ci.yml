name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest opam releases, so a breaking upstream
  # release shows up even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test

      # The opam switch is restored from cache, so bring every package up to
      # the latest release instead of keeping whatever was cached.
      - run: opam update && opam upgrade --yes

      - run: opam exec -- dune build

      - run: opam exec -- dune test
